.b1{top:-6px;right:8px}.b2{bottom:4px;left:8px;animation-delay:.8s}.b3{bottom:34%;right:-2px;animation-delay:1.5s}@keyframes fy{to{transform:translateY(-8px)}}

.st span{font-size:1.3rem;display:block}
